name: Ruby Gem CI & Packaging

on:
  push:
    branches: [ main ]
    paths:
      - 'ruby/**'
      - '.github/workflows/ruby-gem.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ruby/**'
      - '.github/workflows/ruby-gem.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gem-check:
    name: Build & Verify Ruby Gem
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.1', '3.2', '3.3']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Syntax Check
        run: |
          ruby -c ruby/lib/personal_foundation.rb
          ruby -c ruby/lib/personal_foundation/client.rb
          ruby -c ruby/lib/personal_foundation/configuration.rb
          ruby -c ruby/lib/personal_foundation/response.rb
          ruby -c ruby/lib/personal_foundation/version.rb
          ruby -c ruby/exe/personal_foundation

      - name: Build Gem Package
        run: |
          cd ruby
          gem build personal_foundation.gemspec

      - name: Test Installing Gem
        run: |
          gem install ruby/personal_foundation-*.gem

      - name: Test CLI Executable
        run: |
          personal_foundation --version
          personal_foundation --help
