name: CI - Swift Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System & Swift Info
        run: |
          uname -a
          sw_vers
          swift --version

      - name: Build PersonalFoundation
        run: swift build -c release

      - name: Stage Metal Library
        run: |
          METALLIB=$(find .build -name "default.metallib" 2>/dev/null | head -n 1)
          if [ -n "$METALLIB" ]; then
            cp "$METALLIB" ./default.metallib
            cp "$METALLIB" ./mlx.metallib
            echo "Staged metallib from $METALLIB to ./default.metallib and ./mlx.metallib"
          else
            echo "No default.metallib found in .build"
          fi

      - name: Run Test Suite
        run: swift test -c release
