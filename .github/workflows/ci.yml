name: CI - Swift Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System & Swift Info
        run: |
          uname -a
          sw_vers
          swift --version

      - name: Build PersonalFoundation
        run: swift build -c release

      - name: Stage Metal Library
        run: |
          cp Sources/PersonalFoundation/Resources/default.metallib ./default.metallib
          cp Sources/PersonalFoundation/Resources/default.metallib ./mlx.metallib
          echo "Staged default.metallib and mlx.metallib into workspace root"

      - name: Run Test Suite
        run: swift test -c release
